model:
  d_model: 128
  layers: 4
  rbf_kernels: 16
  cutoff: 5.0
  use_ligand_flag: true
  edge_swish: false

  energy_head:
    hidden: 128

  tokenizer:
    enabled: true
    kp: 192
    kl: 32
    kint: 64
    attn_heads: 4
    dropout: 0.0

    locality:
      enabled: true
    entropy:
      enabled: false

  regressor:
    hidden: 256
    dropout: 0.0
