seed: 0

io:
  processed_root: data/processed/lba60_existing_pocket
  runs_root: runs/affinity
  outputs_root: outputs

train:
  epochs: 80
  batch_size: 16
  num_workers: 8
  grad_clip_norm: 1.0
  log_every: 20
  eval_every: 1
  save_best_metric: val/pearson

optim:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-6

sched:
  name: warmup_cosine
  warmup_epochs: 2
  min_lr: 1.0e-5

loss:
  name: balanced_mse
  balanced_mse:
    num_bins: 50
    init_sigma: 1.0
  ranking:
    enabled: true
    name: pairwise_softplus
    margin: 0.0
  weights:
    rank: 0.2
    loc: 1.0e-3
    entropy: 0.0
