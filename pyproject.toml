[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml710-sequence-binding"
version = "0.1.0"
description = "Sequence+SMILES binary binding project for ML710 distributed training experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequence_binding*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
